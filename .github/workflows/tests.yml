name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12", "3.13"]
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --all-extras --python ${{ matrix.python }}
      # Every scoring formula and grading rule stays fully tested (NFR-MAINT-1).
      - run: >
          uv run --python ${{ matrix.python }} pytest -q
          --cov=gcboard.server.scoring --cov=gcboard.server.textrules --cov-branch
          --cov-report=term-missing --cov-fail-under=100
