[project]
name = "gcboard"
version = "0.1.0"
description = "Terminal leaderboard for a group of programmers practicing without AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "textual>=0.80",
    "httpx>=0.27",
    "platformdirs>=4.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
server = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlmodel>=0.0.16",
    "apscheduler>=3.10,<4",
]

[project.scripts]
gcboard = "gcboard.client.app:main"
gcboard-server = "gcboard.server.main:run"
gcboard-admin = "gcboard.server.admin:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gcboard"]

[tool.pytest.ini_options]
testpaths = ["tests"]
